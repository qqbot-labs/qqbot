# Activate only after DNS A record and this domain certificate are verified.
server {
    listen 80;
    listen [::]:80;
    server_name qqbot.example.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/qq-agent-acme; }
    location / { return 301 https://qqbot.example.com$request_uri; }
}
# Dedicated project listener; existing 80/443 virtual hosts are unchanged.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qqbot.example.com;
    ssl_certificate /etc/letsencrypt/live/qqbot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qqbot.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    location / {
        proxy_pass http://127.0.0.1:13800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
