# Dedicated project listener; existing 80/443 virtual hosts are unchanged.
server {
    listen 13843 ssl;
    server_name YOUR_VPS_IP;
    ssl_certificate /etc/letsencrypt/live/YOUR_VPS_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_VPS_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    location / {
        proxy_pass http://127.0.0.1:13800;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
